<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tags</title>
</head>
<body>

    <!--Video Tag is used to add videos in the webpages!-->
    <!--Height & Width attributes are also used to adjust the video sizez just like image-->

    <video src="/html/assets/demo-video.mp4" height="250px"></video>
    

    <!--just like image, also alt attribute in videos -->
    
    <!--There are some new attributes in video-->
    <!-- autoplay - used to autoplay video while opening the page
        controls - used to show dowload/settings ect controls in the page.
        muted - used to make video muted by default and many more tags are there.
    -->

    <video src="demo-video.mp4" alt="video is not availabe"></video>
    <br><hr><br>
    <video src="/html/assets/demo-video.mp4" width="500px" autoplay controls muted></video>

    <!--Also we can add external videos by pasing their links. -->
</body>
</html>
