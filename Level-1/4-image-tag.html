<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tags</title>
</head>
<body>

    <!--Img Tag is used to add images in the webpages!-->
    <!--Height & Width attributes are also used to adjust the image in the page-->

    <img src="/html/images/demo-img.png" height="500px">
    

    <!--alt attribute is also used to show alternative text while image is not available-->

    <img src="demo-img.png" height="150px" alt="Image is not availabe because of some issue">


    <!--Also we can add external images by pasing their links. -->

    <img src="https://wallpaperaccess.com/full/7804689.jpg" width="200px" alt="image not availabe due to your internet problem">
</body>
</html>
